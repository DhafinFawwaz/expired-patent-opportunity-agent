[project]
name = "patentic"
version = "0.1.0"
description = "Evidence-backed screening of US patents that lapsed for nonpayment of maintenance fees"
readme = "README.md"
authors = [{ name = "Dhafin Fawwaz", email = "dhafin.fawwaz@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "freellm",
    "langgraph>=1.2.20,<1.3",
    "langchain>=1.4.9,<1.5",
    "langchain-core>=1.7.6,<2",
    "langchain-litellm>=0.11.2",
    "litellm>=1.108.2,!=1.107.0",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28,<0.29",
    "tenacity>=9.2",
    "google-cloud-bigquery>=3.47",
    "python-epo-ops-client>=4.2.3",
    "python-docx>=1.2",
    "python-pptx>=1.0.2",
    "rich>=15",
    "typer>=0.28",
    "pyyaml>=6",
    "defusedxml>=0.7",
    "jsonschema>=4.26",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-socket>=0.7",
    "pytest-recording>=0.14",
    "respx>=0.23",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-PyYAML",
    "types-defusedxml",
    "types-jsonschema",
    "pypdf>=7",
]

[project.scripts]
patentic = "patentic.cli:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11"
default-groups = "all"
exclude-newer = "2026-11-07T00:00:00Z"

[tool.uv.workspace]
members = ["llm"]

[tool.uv.sources]
freellm = { workspace = true }

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = ["deprecated", "ignore-without-code"]
plugins = ["pydantic.mypy"]
mypy_path = ["src", "llm/src"]
files = ["src", "llm/src", "tests", "llm/tests", "conftest.py"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# python-epo-ops-client ships no type information.
module = ["epo_ops", "epo_ops.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tools/ooxml"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "CPY",
    "D1",      # docstrings only where they add information
    "FIX002",
    "PERF203",
    "PLR09",
    "TD002",
    "TD003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "SLF001", "PLR2004", "ARG", "PLC0415", "INP001", "FBT001", "TC001", "TC002", "TC003", "S105", "S106"]
# Table names are constants and every value goes in as a query parameter.
"src/patentic/adapters/bigquery_sql.py" = ["S608"]
# Typer options are boolean defaults; overrides must keep the parent signature.
"src/patentic/cli.py" = ["FBT001", "FBT002"]
"src/patentic/llm/null_model.py" = ["ARG002"]
# Report sentences read better unbroken.
"src/patentic/graph/nodes/bundle.py" = ["E501"]
"llm/tests/**" = ["S101", "S311", "SLF001", "PLR2004", "ARG", "PLC0415", "INP001", "PT011", "PT018", "FBT003", "E501", "ERA001", "B018", "SIM105", "S110", "BLE001"]
# freellm predates this repo: style-only rules relaxed, typing rules kept.
"llm/src/freellm/cli.py" = ["T201", "BLE001", "PLC0415"]
"llm/src/freellm/**" = ["E501", "ARG001", "ARG002", "PLW2901", "D205", "BLE001", "EM101", "EM102", "TRY003", "FBT001", "FBT002", "FBT003", "PLR2004", "PLW0603", "PERF401", "S324", "S110", "SIM105"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket --strict-markers --strict-config -m 'not live and not render'"
markers = [
    "live: needs network and credentials (PATENTIC_LIVE=1)",
    "render: needs LibreOffice",
]
testpaths = ["tests", "llm/tests"]
